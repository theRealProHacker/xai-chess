[package]
name = "dsl_verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
shakmaty = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.104"

[lib]
crate-type = ["cdylib", "rlib"]
