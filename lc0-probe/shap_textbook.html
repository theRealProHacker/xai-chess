<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotators vs Shapley</title>
<link rel="stylesheet" href="../docs/vendor/chessground/chessground.cburnett.css">
<style>
:root{
  --shadow-s: inset 0 1px 2px #ffffff30, 0 1px 2px #00000030, 0 2px 4px #00000015;
  --shadow-m: inset 0 1px 2px #ffffff50, 0 2px 4px #00000030, 0 4px 8px #00000015;
  --pos:#2e8b57; --neg:#c0392b; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e4;
}
*{box-sizing:border-box}
body{
  max-width:1180px; margin:2rem auto 3rem; padding:0 1.5rem; background:#fff; color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.01em;margin:0 0 .2rem}
p.intro{color:var(--muted);margin:0 0 1.4rem}
main{display:grid;grid-template-columns:250px 400px 1fr;gap:1.8rem;align-items:start}
@media (max-width:1000px){main{grid-template-columns:1fr 1fr}#games{grid-column:1/-1;max-height:14rem}}
@media (max-width:640px){main{grid-template-columns:1fr}}
#games{max-height:calc(100vh - 7rem);overflow-y:auto;position:sticky;top:1rem}
#games h3{font-size:.85rem;font-weight:600;color:var(--muted);margin:.8rem 0 .2rem}
#games h3:first-child{margin-top:0}
#games button{
  display:flex;justify-content:space-between;gap:.5rem;width:100%;text-align:left;font:inherit;font-size:.88rem;
  padding:.25rem .5rem;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;
}
#games button:hover{background:#f2f2f2}
#games button.on{background:#e9eef5;font-weight:600}
#games .v{flex:none}
.yes{color:var(--pos)}.no{color:var(--neg)}
#board{
  display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;
  border-radius:6px;overflow:hidden;box-shadow:var(--shadow-m);
}
.sq{position:relative}
.sq.light{background:#f0d9b5}.sq.dark{background:#b58863}
.sq piece{position:absolute;inset:0;background-size:cover}
.under{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;margin-top:.5rem}
h2{font-size:1.15rem;font-weight:600;margin:0}
.when{color:var(--muted);margin:0 0 .9rem}
blockquote{margin:0 0 .3rem;padding-left:.9rem;border-left:3px solid var(--line);font-style:italic}
.cite{color:var(--muted);font-size:.85rem;margin:0 0 1.4rem}
.cite a{color:inherit}
.verdict{padding:1rem 1.1rem;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-s)}
.verdict b.big{font-size:1.05rem}
.verdict p{margin:.3rem 0 0}
.track{position:relative;height:8px;margin:1rem 0 .3rem;border-radius:4px;
  background:linear-gradient(90deg,#eee 0 75%,#d7ecdf 75% 100%)}
.track i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem}
details{margin-top:1.2rem;color:var(--muted);font-size:.88rem}
summary{cursor:pointer}
.row{display:grid;grid-template-columns:8.5rem 1fr 3.6rem;gap:.5rem;align-items:center;padding:.08rem .2rem;font-size:.82rem;color:var(--ink)}
.row.fam{background:#e9eef5;border-radius:4px;font-weight:600}
.row .v{text-align:right;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
</style>
</head>
<body>
<h1>Annotators vs Shapley</h1>
<p class="intro">Moments from master games where a classic annotator names a positional advantage. Does Leela's Shapley value for that feature agree?</p>
<main>
  <nav id="games"></nav>
  <section>
    <div id="board" class="cg-wrap"></div>
    <div class="under"><span id="move"></span><span id="leela"></span></div>
  </section>
  <section>
    <h2 id="game"></h2>
    <p class="when" id="when"></p>
    <blockquote id="quote"></blockquote>
    <p class="cite" id="cite"></p>
    <div class="verdict">
      <b class="big" id="vhead"></b>
      <p id="vtext"></p>
      <div class="track"><i id="mark"></i></div>
      <div class="scale"><span>0</span><span>75</span><span>100</span></div>
    </div>
    <details><summary>All feature families</summary><div id="fams"></div></details>
  </section>
</main>
<script src="square_shap_textbook.js"></script>
<script>
const S = window.SHAP, P = S.positions.filter(p => p.topic !== "king safety"),   // king safety dropped for now
      $ = id => document.getElementById(id);
const ROLE = {p: "pawn", n: "knight", b: "bishop", r: "rook", q: "queen", k: "king"};
const cap = s => s[0].toUpperCase() + s.slice(1);
const fmt = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
const FAMNAME = {square: "square control", strong: "strong squares", pawn_shield: "pawn shield", bishop_pair: "bishop pair"};
let cur = 0;

function board(fen) {
  let html = "";
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let f = 0;
    for (const c of row) {
      if (c >= "1" && c <= "8") { for (let i = 0; i < +c; i++, f++) html += `<div class="sq ${(f + r) % 2 ? "dark" : "light"}"></div>`; continue; }
      html += `<div class="sq ${(f + r) % 2 ? "dark" : "light"}"><piece class="${c === c.toUpperCase() ? "white" : "black"} ${ROLE[c.toLowerCase()]}"></piece></div>`;
      f++;
    }
  });
  $("board").innerHTML = html;
}

// "Book, chapter…; White – Black, Event Year, after 9...d5"
const split = p => {
  const [book, game] = p.source.split(/;\s*(?=[^;]*$)/), m = game.match(/^(.*?),\s*(after .*)$/);
  return {book, game: m ? m[1] : game, after: m ? m[2] : ""};
};

function nav() {
  const topics = [...new Set(P.map(p => p.topic))];
  $("games").innerHTML = topics.map(t => `<h3>${cap(t)}</h3>` + P.map((p, i) => [p, i]).filter(([p]) => p.topic === t)
    .map(([p, i]) => `<button data-i="${i}"><span>${split(p).game.split(",")[0]}</span><span class="v ${p.verdict === "supported" ? "yes" : "no"}">${p.verdict === "supported" ? "✓" : "✗"}</span></button>`).join("")).join("");
  $("games").onclick = e => { const b = e.target.closest("button"); if (b) { cur = +b.dataset.i; draw(); } };
}

function draw() {
  const p = P[cur], s = split(p), k = p.side_to_move === "black" ? -1 : 1;   // un-mirror: values for White
  document.querySelectorAll("#games button").forEach(b => b.classList.toggle("on", +b.dataset.i === cur));
  board(p.orig_fen);
  $("move").textContent = `${cap(p.side_to_move)} to move`;
  $("leela").textContent = `Leela: ${fmt(k * p.y)} for White`;
  $("game").textContent = s.game;
  $("when").textContent = cap(s.after);
  $("quote").textContent = `“${p.quote}”`;
  $("cite").innerHTML = p.url ? `<a href="${p.url}">${s.book}</a>` : s.book;
  const fp = p.favours === p.side_to_move ? p.percentile : 100 - p.percentile, ok = p.verdict === "supported";
  const fam = FAMNAME[p.family] || p.family;
  $("vhead").className = "big " + (ok ? "yes" : "no");
  $("vhead").textContent = ok ? "Shapley agrees" : "Shapley disagrees";
  $("vtext").textContent = `${cap(p.topic)}, favouring ${cap(p.favours)}. Leela's credit for ${fam} toward ${cap(p.favours)} is higher than in ${Math.round(fp)}% of 300 game positions; agreement needs 75%.`;
  $("mark").style.left = fp + "%";
  const phi = p["phi targets held"].map(v => k * v), max = Math.max(...phi.map(Math.abs), 1e-9);
  $("fams").innerHTML = S.families.map((f, i) => [f, phi[i]]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
    .map(([f, v]) => `<div class="row${f === p.family ? " fam" : ""}"><span>${f}</span><span class="bar"><i style="background:var(--${v >= 0 ? "pos" : "neg"});width:${50 * Math.abs(v) / max}%;${v >= 0 ? "left:50%" : "right:50%"}"></i></span><span class="v">${fmt(v)}</span></div>`).join("");
}

document.onkeydown = e => {
  if (e.key === "ArrowDown" || e.key === "ArrowRight") { cur = (cur + 1) % P.length; draw(); }
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") { cur = (cur - 1 + P.length) % P.length; draw(); }
};
nav(); draw();
</script>
</body>
</html>
